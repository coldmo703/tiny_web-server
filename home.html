<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiny Web Server</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
      --success-bg: #ecfdf5;
      --success-text: #065f46;
      --success-border: #a7f3d0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 520px;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
    }

    .header { text-align: center; margin-bottom: 28px; }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      background-color: #dbeafe;
      color: #1e40af;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 9999px;
      margin-bottom: 10px;
    }

    h1 { font-size: 1.75rem; font-weight: 700; color: #0f172a; }
    p.subtitle { font-size: 0.95rem; color: #64748b; margin-top: 6px; }

    .section {
      background: #f1f5f9;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .input-group {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 12px;
    }

    input[type="number"] {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border 0.2s;
    }

    input[type="number"]:focus { border-color: var(--primary); }
    .op-sign { font-size: 1.2rem; font-weight: bold; color: #64748b; }

    button {
      width: 100%;
      padding: 12px;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:hover { background-color: var(--primary-hover); }
    button:active { transform: scale(0.98); }

    .btn-secondary { background-color: #475569; }
    .btn-secondary:hover { background-color: #334155; }

    /* 연산 결과 표시창 스타일 */
    .result-box {
      margin-top: 14px;
      padding: 14px 16px;
      background-color: var(--success-bg);
      color: var(--success-text);
      border: 1px solid var(--success-border);
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      text-align: center;
      display: none; /* 평소에는 숨김 */
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .image-container {
      margin-top: 14px;
      text-align: center;
      display: none;
    }

    .image-container img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    footer {
      text-align: center;
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: 24px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <span class="badge">HTTP/1.0 Server</span>
      <h1>Tiny Web Server</h1>
      <p class="subtitle">CS:APP 시스템 프로그래밍 프로젝트</p>
    </div>

    <!-- 1. 비동기 CGI Adder 위젯 -->
    <div class="section">
      <div class="section-title">⚡ 비동기 CGI 덧셈기 (AJAX)</div>
      <div class="input-group">
        <input type="number" id="num1" value="15000" placeholder="숫자 1">
        <span class="op-sign">+</span>
        <input type="number" id="num2" value="213" placeholder="숫자 2">
      </div>
      <button id="calcBtn" onclick="runAdderAsync()">계산하기</button>

      <!-- 결과가 표시될 자리 -->
      <div id="resultBox" class="result-box"></div>
    </div>

    <!-- 2. 정적 이미지 서빙 위젯 -->
    <div class="section">
      <div class="section-title">🖼️ 정적 이미지 서빙</div>
      <button class="btn-secondary" onclick="toggleImage()">고질라 이미지 토글</button>
      <div id="imgBox" class="image-container">
        <img id="godzillaImg" src="/godzilla.png" alt="Godzilla" onerror="this.onerror=null; this.src='/godzilla.gif';">
      </div>
    </div>

    <footer>
      Running on Custom Tiny Web Server &bull; Port 8000
    </footer>
  </div>

  <script>
    async function runAdderAsync() {
      const n1 = document.getElementById('num1').value || '0';
      const n2 = document.getElementById('num2').value || '0';
      const resultBox = document.getElementById('resultBox');
      const calcBtn = document.getElementById('calcBtn');

      calcBtn.innerText = "계산 중...";
      calcBtn.disabled = true;

      try {
        /* 백그라운드에서 Tiny 서버의 adder로 비동기 GET 요청 전송 */
        const response = await fetch(`/cgi-bin/adder?${n1}&${n2}`);
        const htmlText = await response.text();

        /* adder가 돌려준 HTML 텍스트에서 결과 문장("The answer is: ...")만 정규식으로 추출 */
        const match = htmlText.match(/The answer is: ([^<]+)/);

        if (match && match[1]) {
          resultBox.innerHTML = `🎉 결과: <strong>${match[1].trim()}</strong>`;
        } else {
          /* 파싱이 안 될 경우 원본 내용 그대로 표시 */
          resultBox.innerText = htmlText;
        }

        resultBox.style.display = 'block';
      } catch (err) {
        resultBox.innerHTML = `<span style="color: #dc2626;">요청 실패: ${err.message}</span>`;
        resultBox.style.display = 'block';
      } finally {
        calcBtn.innerText = "계산하기";
        calcBtn.disabled = false;
      }
    }

    function toggleImage() {
      const box = document.getElementById('imgBox');
      box.style.display = (box.style.display === 'block') ? 'none' : 'block';
    }
  </script>
</body>
</html>
